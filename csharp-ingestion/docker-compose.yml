# Runs the full system locally: PostgreSQL, the C# ingestion API, the Python forecasting API and the Spring Boot API.
name: budget-system

services:
  postgres:
    image: postgres:16-alpine
    container_name: budget-postgres
    environment:
      POSTGRES_DB: budget_prototype
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in csharp-ingestion/.env (copy .env.example)}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - budget_pgdata:/var/lib/postgresql/data
      - ../database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget -d budget_prototype"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: BudgetIngestion/Dockerfile
    container_name: budget-ingestion
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=budget_prototype;Username=budget;Password=${POSTGRES_PASSWORD}
    # Host port for Swagger. The Java API calls this service at http://api:8080.
    ports:
      - "127.0.0.1:5080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  forecast:
    build:
      context: ../python-forecast
    container_name: budget-forecast
    environment:
      DATABASE_URL: postgresql://budget:${POSTGRES_PASSWORD}@postgres:5432/budget_prototype
    # Host port for the docs page. The Java API calls this service at http://forecast:8000.
    ports:
      - "127.0.0.1:5090:8000"
    depends_on:
      postgres:
        condition: service_healthy

  java-api:
    build:
      context: ../java-api
    container_name: budget-java-api
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: budget_prototype
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Ports inside the Docker network, not the host ports 5090 and 5080.
      FORECAST_BASE_URL: http://forecast:8000
      ALERTS_BASE_URL: http://api:8080
      SERVER_PORT: 8080
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
      forecast:
        condition: service_started

volumes:
  budget_pgdata:
