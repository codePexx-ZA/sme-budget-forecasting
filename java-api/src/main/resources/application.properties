spring.application.name=budget-api

# Reads settings from java-api/.env when it exists (copy .env.example). Real environment variables win.
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

# Database: the shared PostgreSQL from csharp-ingestion/docker-compose.yml. The password has no default on purpose.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:budget_prototype}
spring.datasource.username=${POSTGRES_USER:budget}
spring.datasource.password=${POSTGRES_PASSWORD}

# Tables are created only by database/init/*.sql. Hibernate checks our entities match them and never changes them.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Login sessions expire after this many hours.
app.auth.session-hours=${SESSION_HOURS:8}
